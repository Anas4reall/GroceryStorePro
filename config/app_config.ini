[APPLICATION]
name = GroceryStorePro
version = 1.0.0
language = ar
theme = modern
debug = false
log_level = INFO

[DATABASE]
type = sqlite
path = data/grocerystore.db
backup_enabled = true
backup_retention_days = 14
auto_backup_time = 00:00

[UI]
window_width = 1200
window_height = 800
min_width = 1024
min_height = 768
font_family = Arial
font_size = 10
rtl_support = true

[BUSINESS]
company_name = متجر البقالة المحترف
company_name_en = Professional Grocery Store
currency = SAR
currency_symbol = ر.س
tax_rate = 15.0
allow_negative_stock = false
default_pricing_mode = retail

[SECURITY]
session_timeout_minutes = 60
password_min_length = 6
max_login_attempts = 3
lockout_duration_minutes = 15

[BARCODE]
enabled = true
prefix = 
suffix = 
	
min_length = 8
max_length = 20

[REPORTS]
default_format = pdf
output_directory = reports/output
template_directory = reports/templates
company_logo = assets/images/logo.png

